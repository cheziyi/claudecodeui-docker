# Docker inside the container, apart from your own containers (see the
# README's Docker section). To enable:
#   mkdir -p ~/.config/containers/systemd/claudecodeui.container.d
#   cp dind.conf ~/.config/containers/systemd/claudecodeui.container.d/
#   systemctl --user daemon-reload && systemctl --user restart claudecodeui

[Container]
# The entrypoint starts as root to run dockerd, then runs the UI as dev, which
# keep-id still maps to your host user.
User=0:0
PodmanArgs=--privileged
Environment=DIND=1
# The inner Docker's images, containers and build cache.
Volume=claudecodeui-docker:/var/lib/docker
# Time for the inner Docker to stop its own containers (10s each).
StopTimeout=30
