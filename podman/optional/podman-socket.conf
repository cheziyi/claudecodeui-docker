# Lets the container's docker CLI use your rootless Podman, which gives the
# agent control of your host user's containers (see the README's Docker
# section). Use this or dind.conf, not both. To enable:
#   systemctl --user enable --now podman.socket
#   mkdir -p ~/.config/containers/systemd/claudecodeui.container.d
#   cp podman-socket.conf ~/.config/containers/systemd/claudecodeui.container.d/
#   systemctl --user daemon-reload && systemctl --user restart claudecodeui

[Container]
Volume=%t/podman/podman.sock:/var/run/docker.sock
# SELinux blocks a container from connecting to the socket otherwise.
SecurityLabelDisable=true
