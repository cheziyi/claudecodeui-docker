# Optional: Docker. Off by default (see the README's Docker section). To turn
# it on, uncomment every line ending in ONE of these markers:
#   # DinD    Docker inside this container, apart from your own containers
#   # socket  the host's Docker, which gives the agent root on the host

services:
  claudecodeui:
    image: ghcr.io/cheziyi/claudecodeui:1
    # Or build it yourself from this repository:
    # build: .
    container_name: claudecodeui
    restart: unless-stopped
    # Docker's daemon needs it, and time to stop its own containers (10s each).
    # privileged: true                            # DinD
    # stop_grace_period: 30s                      # DinD
    ports:
      - "3001:3001"
    environment:
      # Your host user, so files in ./workspaces stay owned by you. Read from
      # .env next to this file, which the README's quick start writes.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: Etc/UTC
      # DIND: "1"                                 # DinD
      # Optional: commit identity for git inside the container.
      # GIT_USER_NAME: Your Name
      # GIT_USER_EMAIL: you@example.com
      # Optional: skip the interactive login. Use ONE of these. A long-lived
      # subscription token comes from running `claude setup-token`.
      # CLAUDE_CODE_OAUTH_TOKEN: ...
      # ANTHROPIC_API_KEY: ...
    volumes:
      # Your projects, next to this file (~/claudecodeui/workspaces if you
      # followed the README).
      - ./workspaces:/workspaces
      # Claude Code login, settings and sessions, the UI's accounts database,
      # git/gh/ssh config and shell history. Survives image updates.
      - home:/home/dev
      # - docker:/var/lib/docker                  # DinD
      # - /var/run/docker.sock:/var/run/docker.sock  # socket

volumes:
  home:
    # A fixed name, shared with the `docker run` example, so switching between
    # them (or renaming this folder) keeps your data.
    name: claudecodeui-home
  # The inner Docker's images, containers and build cache.
  # docker:                                       # DinD
  #   name: claudecodeui-docker                   # DinD
