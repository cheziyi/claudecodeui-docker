name: Publish image

on:
  # Manual runs on main always rebuild from scratch and push, e.g. to pick up
  # security fixes or a new fnm/uv. On other branches they only build.
  workflow_dispatch:
  # Weekly; skipped when this CloudCLI + Claude Code pair is already published,
  # otherwise rebuilt from scratch like a manual run.
  schedule:
    - cron: "17 4 * * 1"
  # Changes to the image on main; rebuilt from scratch and published.
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - etc/**
      - .github/workflows/publish.yml
  # Every PR builds and smoke-tests the image, with no path filter, so `build`
  # can be a required check.
  pull_request:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Also the required status check's name; renaming it breaks branch protection.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Only main publishes, so a manual run on a branch can't overwrite latest.
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve upstream versions
        id: versions
        run: |
          set -euo pipefail
          cloudcli="$(npm view @cloudcli-ai/cloudcli version)"
          claude="$(npm view @anthropic-ai/claude-code version)"
          {
            echo "cloudcli=$cloudcli"
            echo "claude=$claude"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "tag=${cloudcli}-claude${claude}"
          } >> "$GITHUB_OUTPUT"
          echo "CloudCLI $cloudcli, Claude Code $claude" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version-pair tag is written once and never moves, so it's safe to
      # pin. Scheduled runs skip entirely when it exists; other runs still
      # publish latest and <cloudcli>, just not the pair tag.
      - name: Check for an existing build of this pair
        id: existing
        if: env.PUSH == 'true'
        env:
          REF: ${{ steps.versions.outputs.image }}:${{ steps.versions.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = schedule ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "$REF is already published; nothing to do." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$REF is already published; leaving that tag as is." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - uses: docker/setup-qemu-action@v4
        if: steps.existing.outputs.skip != 'true'

      - uses: docker/setup-buildx-action@v4
        if: steps.existing.outputs.skip != 'true'

      - name: Image metadata
        id: meta
        if: steps.existing.outputs.skip != 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.versions.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.versions.outputs.tag }},enable=${{ steps.existing.outputs.exists != 'true' }}
            type=raw,value=${{ steps.versions.outputs.cloudcli }}
          labels: |
            org.opencontainers.image.title=claudecodeui-docker
            org.opencontainers.image.description=CloudCLI UI (siteboon/claudecodeui) bundled with Claude Code
            org.opencontainers.image.version=${{ steps.versions.outputs.tag }}

      # amd64 first, loaded into Docker for the smoke test. Publishing runs
      # don't read the GitHub cache: on a fresh runner that makes them full
      # rebuilds, with current apt packages, base image and fnm/uv.
      - name: Build amd64 for the smoke test
        if: steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          tags: claudecodeui:smoke
          build-args: |
            CLOUDCLI_VERSION=${{ steps.versions.outputs.cloudcli }}
            CLAUDE_CODE_VERSION=${{ steps.versions.outputs.claude }}
          cache-from: ${{ env.PUSH != 'true' && 'type=gha' || '' }}

      - name: Smoke test
        if: steps.existing.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # A non-default PUID exercises the entrypoint's user remapping.
          docker run -d --name smoke -e PUID=1234 -e PGID=1234 claudecodeui:smoke
          trap 'docker logs smoke; docker rm -f smoke >/dev/null' EXIT
          for _ in $(seq 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' smoke)"
            [ "$status" = starting ] || break
            # Stop waiting if the server crashed.
            [ "$(docker inspect -f '{{.State.Running}}' smoke)" = true ] || { status=exited; break; }
            sleep 2
          done
          echo "health: $status"
          [ "$status" = healthy ]
          docker exec -u dev smoke bash -lc '
            set -e
            [ "$(id -u):$(id -g)" = 1234:1234 ]
            [ "$(stat -c %u /home/dev)" = 1234 ]
            node --version
            fnm --version
            uv --version
            claude --version
            gh --version | head -1
          '

      # Reuses the tested amd64 layers from the builder and adds arm64: from
      # the GitHub cache on PRs, from scratch when publishing.
      - name: Build multi-arch and push
        if: steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          build-args: |
            CLOUDCLI_VERSION=${{ steps.versions.outputs.cloudcli }}
            CLAUDE_CODE_VERSION=${{ steps.versions.outputs.claude }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ env.PUSH != 'true' && 'type=gha' || '' }}
          cache-to: type=gha,mode=max
