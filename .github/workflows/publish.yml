name: Publish image

on:
  # Manual runs always build and push, e.g. to pick up base-image security fixes.
  workflow_dispatch:
  # Weekly; skipped when this CloudCLI + Claude Code pair is already published.
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - etc/**
      - .github/workflows/publish.yml
  # Build-only check for changes to the image.
  pull_request:
    paths:
      - Dockerfile
      - entrypoint.sh
      - etc/**
      - .github/workflows/publish.yml

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve upstream versions
        id: versions
        run: |
          set -euo pipefail
          cloudcli="$(npm view @cloudcli-ai/cloudcli version)"
          claude="$(npm view @anthropic-ai/claude-code version)"
          {
            echo "cloudcli=$cloudcli"
            echo "claude=$claude"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "tag=${cloudcli}-claude${claude}"
          } >> "$GITHUB_OUTPUT"
          echo "CloudCLI $cloudcli, Claude Code $claude" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if already published
        id: existing
        if: github.event_name == 'schedule'
        env:
          REF: ${{ steps.versions.outputs.image }}:${{ steps.versions.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$REF is already published; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: docker/setup-qemu-action@v4
        if: steps.existing.outputs.skip != 'true'

      - uses: docker/setup-buildx-action@v4
        if: steps.existing.outputs.skip != 'true'

      - name: Image metadata
        id: meta
        if: steps.existing.outputs.skip != 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.versions.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.versions.outputs.tag }}
            type=raw,value=${{ steps.versions.outputs.cloudcli }}
          labels: |
            org.opencontainers.image.title=claudecodeui-docker
            org.opencontainers.image.description=CloudCLI UI (siteboon/claudecodeui) bundled with Claude Code
            org.opencontainers.image.version=${{ steps.versions.outputs.tag }}

      - name: Build and push
        if: steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          build-args: |
            CLOUDCLI_VERSION=${{ steps.versions.outputs.cloudcli }}
            CLAUDE_CODE_VERSION=${{ steps.versions.outputs.claude }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
