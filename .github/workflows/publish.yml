name: Publish image

on:
  # Manual runs on main always rebuild from scratch and push, e.g. to pick up
  # security fixes or a new fnm/uv. On other branches they only build.
  workflow_dispatch:
  # Weekly; skipped when this CloudCLI + Claude Code pair is already published,
  # otherwise rebuilt from scratch like a manual run.
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - etc/**
      - .github/workflows/publish.yml
  # Build-only check for changes to the image.
  pull_request:
    paths:
      - Dockerfile
      - entrypoint.sh
      - etc/**
      - .github/workflows/publish.yml

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Only main publishes, so a manual run on a branch can't overwrite latest.
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve upstream versions
        id: versions
        run: |
          set -euo pipefail
          cloudcli="$(npm view @cloudcli-ai/cloudcli version)"
          claude="$(npm view @anthropic-ai/claude-code version)"
          {
            echo "cloudcli=$cloudcli"
            echo "claude=$claude"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "tag=${cloudcli}-claude${claude}"
          } >> "$GITHUB_OUTPUT"
          echo "CloudCLI $cloudcli, Claude Code $claude" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version-pair tag is written once and never moves, so it's safe to
      # pin. Scheduled runs skip entirely when it exists; other runs still
      # publish latest and <cloudcli>, just not the pair tag.
      - name: Check for an existing build of this pair
        id: existing
        if: env.PUSH == 'true'
        env:
          REF: ${{ steps.versions.outputs.image }}:${{ steps.versions.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" = schedule ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "$REF is already published; nothing to do." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$REF is already published; leaving that tag as is." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - uses: docker/setup-qemu-action@v4
        if: steps.existing.outputs.skip != 'true'

      - uses: docker/setup-buildx-action@v4
        if: steps.existing.outputs.skip != 'true'

      - name: Image metadata
        id: meta
        if: steps.existing.outputs.skip != 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.versions.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.versions.outputs.tag }},enable=${{ steps.existing.outputs.exists != 'true' }}
            type=raw,value=${{ steps.versions.outputs.cloudcli }}
          labels: |
            org.opencontainers.image.title=claudecodeui-docker
            org.opencontainers.image.description=CloudCLI UI (siteboon/claudecodeui) bundled with Claude Code
            org.opencontainers.image.version=${{ steps.versions.outputs.tag }}

      - name: Build and push
        if: steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          # Manual and scheduled runs skip the layer cache and re-pull the base,
          # so apt packages, the base image and the latest fnm/uv are actually
          # refreshed. Pushes and PRs keep the cache for fast builds.
          no-cache: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
          pull: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
          build-args: |
            CLOUDCLI_VERSION=${{ steps.versions.outputs.cloudcli }}
            CLAUDE_CODE_VERSION=${{ steps.versions.outputs.claude }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
