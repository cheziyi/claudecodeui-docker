name: Build image

on:
  # Every PR builds and smoke-tests the image, with no path filter, so `build`
  # can be a required check. Nothing is pushed.
  pull_request:
  # Pushing a release tag (v1.2.3, or v1.2.3-rc.1 for a pre-release) publishes
  # that release.
  push:
    tags: ["v*"]
  # Weekly: rebuild the latest release when CloudCLI or Claude Code has a new
  # version, picking up Debian and fnm/uv updates along the way.
  schedule:
    - cron: "17 4 * * 1"
  # Manual: rebuild a release (default: the latest) from scratch, e.g. to pick
  # up security fixes. Publishes only when run from main.
  workflow_dispatch:
    inputs:
      version:
        description: Release to rebuild, e.g. 1.2.3 (default the latest release)
        required: false

concurrency:
  # Runs that may publish share one group, so they can't move the same tags
  # out of order. GitHub keeps one pending run per group; a newer one cancels
  # it, so push release tags one at a time.
  group: build-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Also the required status check's name; renaming it breaks branch protection.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PUSH: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Release tags, to find the latest release and which tags move.
          fetch-depth: 0

      # Which release this run builds, checked out, and the tags it gets. Each
      # of X.Y, X and latest moves only if this is the highest release in that
      # line, so a patch to an older line can't take latest backwards.
      - name: Resolve release
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          image="${IMAGE,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          stable() { git tag --list 'v*' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V; }

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              {
                echo "version=0.0.0-pr.${{ github.event.number }}"
                echo "revision=$GITHUB_SHA"
              } >> "$GITHUB_OUTPUT"
              exit 0 ;;
            push)
              tag="$GITHUB_REF_NAME" ;;
            *)
              if [ -n "${INPUT_VERSION:-}" ]; then tag="v${INPUT_VERSION#v}"; else tag="$(stable | tail -1)"; fi
              if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                echo "::error::No release tag $tag"
                exit 1
              fi
              git checkout --detach "$tag" ;;
          esac

          version="${tag#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$tag is not a release tag (vX.Y.Z or vX.Y.Z-prerelease)"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"

          tags="$image:$version"
          if [ -z "${BASH_REMATCH[3]}" ]; then
            [ "$(stable | grep "^v$major\.$minor\." | tail -1)" = "$tag" ] && tags="$tags,$image:$major.$minor"
            [ "$(stable | grep "^v$major\." | tail -1)" = "$tag" ] && tags="$tags,$image:$major"
            [ "$(stable | tail -1)" = "$tag" ] && tags="$tags,$image:latest"
          fi
          {
            echo "version=$version"
            echo "tags=$tags"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Release $version → ${tags//,/, }" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve upstream versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The ranges come from the release being built, so each release line
          # keeps the upstream majors it was released with.
          # shellcheck source=/dev/null
          . ./upstream.env
          # Stable versions matching a range, ascending; prints nothing if none.
          matching() { npx --yes semver@7.7.2 -r "$1" "${@:2}" 2>/dev/null || true; }
          # Up to the `latest` dist-tag, like `npm install`: a package can
          # publish ahead of it.
          # shellcheck disable=SC2046 # one version per word
          npm_versions() { matching "<=$(npm view "$1" dist-tags.latest)" $(npm view "$1" versions --json | jq -r '.[]'); }
          # Published releases, not tags: a tag can exist hours before its assets.
          gh_versions() { gh release list -R "$1" --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName'; }

          # resolve <name> <output> <range> <versions...>: picks the newest
          # version in the range, and notes a newer one the range keeps out.
          resolve() {
            local name="$1" output="$2" range="$3" pick latest
            shift 3
            pick="$(matching "$range" "$@" | tail -1)"
            latest="$(matching '*' "$@" | tail -1)"
            if [ -z "$pick" ]; then
              echo "::error::No $name release matches $range in upstream.env"
              exit 1
            fi
            if [ "$latest" != "$pick" ]; then
              echo "::notice::$name $latest is out but outside $range; staying on $pick. Widen the range in upstream.env to adopt it."
            fi
            echo "$output=$pick" >> "$GITHUB_OUTPUT"
            echo "- $name $pick (\`$range\`)" >> "$GITHUB_STEP_SUMMARY"
          }

          # shellcheck disable=SC2046 # one version per word
          {
            resolve CloudCLI cloudcli "$CLOUDCLI_RANGE" $(npm_versions @cloudcli-ai/cloudcli)
            resolve "Claude Code" claude "$CLAUDE_CODE_RANGE" $(npm_versions @anthropic-ai/claude-code)
            resolve fnm fnm "$FNM_RANGE" $(gh_versions Schniz/fnm)
            resolve uv uv "$UV_RANGE" $(gh_versions astral-sh/uv)
          }

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Weekly runs skip when the published build of this release already has
      # these CloudCLI, Claude Code, fnm and uv versions, read from its labels.
      - name: Check whether upstream changed
        id: existing
        if: github.event_name == 'schedule'
        env:
          REF: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          WANT: ${{ steps.versions.outputs.cloudcli }} ${{ steps.versions.outputs.claude }} ${{ steps.versions.outputs.fnm }} ${{ steps.versions.outputs.uv }}
        run: |
          set -euo pipefail
          if ! config="$(docker buildx imagetools inspect "$REF" --format '{{json .Image}}' 2>/dev/null)"; then
            echo "$REF isn't published yet; building it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # One config per platform; their labels match.
          have="$(jq -r 'to_entries[0].value.config.Labels
            | [.["io.github.cheziyi.claudecodeui-docker.cloudcli-version"],
               .["io.github.cheziyi.claudecodeui-docker.claude-code-version"],
               .["io.github.cheziyi.claudecodeui-docker.fnm-version"],
               .["io.github.cheziyi.claudecodeui-docker.uv-version"]]
            | join(" ")' <<<"$config")"
          if [ "$have" = "$WANT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$REF already has these versions ($WANT); nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: docker/setup-qemu-action@v4
        if: steps.existing.outputs.skip != 'true'

      - uses: docker/setup-buildx-action@v4
        if: steps.existing.outputs.skip != 'true'

      # amd64 first, loaded into Docker for the smoke test. Publishing runs
      # don't read the GitHub cache: on a fresh runner that makes them full
      # rebuilds, with current apt packages, base image and fnm/uv.
      - name: Build amd64 for the smoke test
        if: steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          tags: claudecodeui:smoke
          build-args: |
            CLOUDCLI_VERSION=${{ steps.versions.outputs.cloudcli }}
            CLAUDE_CODE_VERSION=${{ steps.versions.outputs.claude }}
            FNM_VERSION=${{ steps.versions.outputs.fnm }}
            UV_VERSION=${{ steps.versions.outputs.uv }}
          cache-from: ${{ env.PUSH != 'true' && 'type=gha' || '' }}

      - name: Smoke test
        if: steps.existing.outputs.skip != 'true'
        env:
          CLOUDCLI: ${{ steps.versions.outputs.cloudcli }}
          CLAUDE: ${{ steps.versions.outputs.claude }}
          FNM: ${{ steps.versions.outputs.fnm }}
          UV: ${{ steps.versions.outputs.uv }}
        run: |
          set -euo pipefail
          # A non-default PUID exercises the entrypoint's user remapping.
          docker run -d --name smoke -e PUID=1234 -e PGID=1234 claudecodeui:smoke
          trap 'docker logs smoke; docker rm -f smoke >/dev/null' EXIT
          for _ in $(seq 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' smoke)"
            [ "$status" = starting ] || break
            # Stop waiting if the server crashed.
            [ "$(docker inspect -f '{{.State.Running}}' smoke)" = true ] || { status=exited; break; }
            sleep 2
          done
          echo "health: $status"
          [ "$status" = healthy ]
          # The image must contain exactly the versions resolved above.
          docker exec -u dev -e CLOUDCLI -e CLAUDE -e FNM -e UV smoke bash -lc '
            set -ex
            [ "$(id -u):$(id -g)" = 1234:1234 ]
            [ "$(stat -c %u /home/dev)" = 1234 ]
            node --version
            [ "$(cloudcli version 2>/dev/null | tail -1)" = "$CLOUDCLI" ]
            [ "$(claude --version)" = "$CLAUDE (Claude Code)" ]
            [ "$(fnm --version)" = "fnm $FNM" ]
            [[ "$(uv --version)" == "uv $UV "* ]]
            gh --version | head -1
          '

      # Reuses the tested amd64 layers from the builder and adds arm64: from
      # the GitHub cache on PRs, from scratch when publishing.
      - name: Build multi-arch and push
        if: steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          build-args: |
            CLOUDCLI_VERSION=${{ steps.versions.outputs.cloudcli }}
            CLAUDE_CODE_VERSION=${{ steps.versions.outputs.claude }}
            FNM_VERSION=${{ steps.versions.outputs.fnm }}
            UV_VERSION=${{ steps.versions.outputs.uv }}
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.title=claudecodeui-docker
            org.opencontainers.image.description=CloudCLI UI (siteboon/claudecodeui) bundled with Claude Code
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}
            io.github.cheziyi.claudecodeui-docker.cloudcli-version=${{ steps.versions.outputs.cloudcli }}
            io.github.cheziyi.claudecodeui-docker.claude-code-version=${{ steps.versions.outputs.claude }}
            io.github.cheziyi.claudecodeui-docker.fnm-version=${{ steps.versions.outputs.fnm }}
            io.github.cheziyi.claudecodeui-docker.uv-version=${{ steps.versions.outputs.uv }}
          cache-from: ${{ env.PUSH != 'true' && 'type=gha' || '' }}
          cache-to: type=gha,mode=max
