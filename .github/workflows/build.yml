name: Build image

on:
  # Every PR builds and smoke-tests the image, with no path filter, so `build`
  # can be a required check. Nothing is pushed.
  pull_request:
  # Pushing a release tag (v1.2.3, or v1.2.3-rc.1 for a pre-release) publishes
  # that release.
  push:
    tags: ["v*"]
  # Daily: publish a new patch release of the latest release's code when
  # CloudCLI, Claude Code, fnm or uv has a new version within its ranges, picking
  # up Debian updates along the way.
  schedule:
    - cron: "17 4 * * *"
  # Manual: publish a new patch release from scratch even if nothing upstream
  # changed, e.g. to pick up security fixes. Publishes only when run from main.
  workflow_dispatch:
    inputs:
      version:
        description: Release line to patch, e.g. 1.2.3 patches the newest 1.2.x (default the latest release)
        required: false

concurrency:
  # Release tags each get their own group, so one can't cancel another while
  # it waits. Order doesn't matter: X.Y, X and latest move at the end of a run,
  # only if it's still the highest release (see the last step).
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Also the required status check's name; renaming it breaks branch protection.
  build:
    runs-on: ubuntu-latest
    permissions:
      # Creates the tags and GitHub releases of patch releases.
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/claudecodeui
      PUSH: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Release tags, to find the latest release and which tags move.
          fetch-depth: 0
          # The repo is the build context, so keep the write token out of it.
          persist-credentials: false

      # Which release this run builds, checked out. Daily and manual runs build
      # the newest release of a line under the next patch version, so main's
      # unreleased changes wait for a release, and published versions never change.
      - name: Resolve release
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          image="${IMAGE,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          stable() { git tag --list 'v*' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V; }

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              {
                echo "version=0.0.0-pr.${{ github.event.number }}"
                echo "revision=$GITHUB_SHA"
              } >> "$GITHUB_OUTPUT"
              exit 0 ;;
            push)
              tag="$GITHUB_REF_NAME" ;;
            *)
              if [ -n "${INPUT_VERSION:-}" ]; then tag="v${INPUT_VERSION#v}"; else tag="$(stable | tail -1)"; fi
              if ! stable | grep -qxF "$tag"; then
                echo "::error::No stable release tag $tag"
                exit 1
              fi
              line="${tag%.*}"
              base="$(stable | grep -E "^${line//./\\.}\.[0-9]+$" | tail -1)"
              git checkout --detach "$base"
              tag="$line.$(( ${base##*.} + 1 ))"
              echo "base=${base#v}" >> "$GITHUB_OUTPUT" ;;
          esac

          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$tag is not a release tag (vX.Y.Z or vX.Y.Z-prerelease)"
            exit 1
          fi
          {
            echo "version=$version"
            echo "tags=$image:$version"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Release $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve upstream versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A failed lookup inside $(...) fails the step, instead of leaving
          # no versions and a misleading "no release matches" error.
          shopt -s inherit_errexit
          # The ranges come from the release being built, so each release line
          # keeps the upstream majors it was released with.
          # shellcheck source=/dev/null
          . ./upstream.env
          npm install --prefix "$RUNNER_TEMP/semver" --no-audit --no-fund --loglevel=error semver@7.7.2
          semver="$RUNNER_TEMP/semver/node_modules/.bin/semver"
          # Stable versions matching a range, ascending; prints nothing if none.
          matching() { "$semver" -r "$1" "${@:2}" || true; }
          # Up to the `latest` dist-tag, like `npm install`: a package can
          # publish ahead of it.
          npm_versions() {
            local info latest
            info="$(npm view "$1" dist-tags.latest versions --json)"
            latest="$(jq -r '.["dist-tags.latest"]' <<<"$info")"
            # shellcheck disable=SC2046 # one version per word
            matching "<=$latest" $(jq -r '.versions[]' <<<"$info")
          }
          # gh_versions <repo> <assets...>: published releases that have every
          # asset the Dockerfile downloads. A tag can exist hours before its
          # release, and a release can be published before its assets upload.
          gh_versions() {
            local repo="$1" tags
            shift
            tags="$(gh api --paginate "repos/$repo/releases?per_page=100" | jq -r --args '.[]
              | select((.draft or .prerelease) | not)
              | select($ARGS.positional - [.assets[] | select(.state == "uploaded") | .name] == [])
              | .tag_name' "$@")"
            # shellcheck disable=SC2086 # one version per word
            matching '*' $tags
          }

          # resolve <name> <output> <range> <versions...>: picks the newest
          # version in the range, and notes a newer one the range keeps out.
          # The versions come sorted, so the last one is the newest.
          resolve() {
            local name="$1" output="$2" range="$3" pick
            shift 3
            pick="$(matching "$range" "$@" | tail -1)"
            if [ -z "$pick" ]; then
              echo "::error::No $name release matches $range in upstream.env"
              exit 1
            fi
            if [ "${!#}" != "$pick" ]; then
              echo "::notice::$name ${!#} is out but outside $range; staying on $pick. Widen the range in upstream.env to adopt it."
            fi
            echo "$output=$pick" >> "$GITHUB_OUTPUT"
            echo "- $name $pick (\`$range\`)" >> "$GITHUB_STEP_SUMMARY"
          }

          cloudcli="$(npm_versions @cloudcli-ai/cloudcli)"
          claude="$(npm_versions @anthropic-ai/claude-code)"
          fnm="$(gh_versions Schniz/fnm fnm-linux.zip fnm-arm64.zip)"
          uv="$(gh_versions astral-sh/uv uv-{x86_64,aarch64}-unknown-linux-gnu.tar.gz{,.sha256})"
          # shellcheck disable=SC2086 # one version per word
          {
            resolve CloudCLI cloudcli "$CLOUDCLI_RANGE" $cloudcli
            resolve "Claude Code" claude "$CLAUDE_CODE_RANGE" $claude
            resolve fnm fnm "$FNM_RANGE" $fnm
            resolve uv uv "$UV_RANGE" $uv
          }

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Before anything is published, so a misconfigured App fails the run early.
      # GITHUB_TOKEN can't tag a commit whose workflow files differ from main's,
      # which patches often do, or commit to main past its ruleset. See
      # "Automatic patch releases" in the README.
      - name: Get the release app's token
        id: app
        if: env.PUSH == 'true' && vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      # Compares the release being patched with the resolved versions, read from
      # its labels. Daily runs skip when they match; the changes go in the notes.
      # Tag pushes skip when that version is already published, as published
      # versions never change: a patch's own tag lands here.
      - name: Check whether upstream changed
        id: existing
        if: env.PUSH == 'true'
        env:
          REF: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.base || steps.release.outputs.version }}
          CLOUDCLI: ${{ steps.versions.outputs.cloudcli }}
          CLAUDE: ${{ steps.versions.outputs.claude }}
          FNM: ${{ steps.versions.outputs.fnm }}
          UV: ${{ steps.versions.outputs.uv }}
        run: |
          set -euo pipefail
          if ! config="$(docker buildx imagetools inspect "$REF" --format '{{json .Image}}' 2>/dev/null)"; then
            echo "$REF isn't published; building it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$REF is already published; nothing to do." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A multi-platform image gives one config per platform; their labels match.
          mapfile -t have <<<"$(jq -r '(if has("config") then . else first(.[]) end).config.Labels
            | .["io.github.cheziyi.claudecodeui-docker.cloudcli-version"],
              .["io.github.cheziyi.claudecodeui-docker.claude-code-version"],
              .["io.github.cheziyi.claudecodeui-docker.fnm-version"],
              .["io.github.cheziyi.claudecodeui-docker.uv-version"]' <<<"$config")"
          names=(CloudCLI "Claude Code" fnm uv)
          want=("$CLOUDCLI" "$CLAUDE" "$FNM" "$UV")
          changes=""
          for i in "${!names[@]}"; do
            if [ "${have[i]}" != "${want[i]}" ]; then
              changes+="${changes:+, }${names[i]} ${have[i]} → ${want[i]}"
            fi
          done
          echo "changes=$changes" >> "$GITHUB_OUTPUT"
          if [ -z "$changes" ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$REF already has these versions (${want[*]}); nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: docker/setup-qemu-action@v4
        if: steps.existing.outputs.skip != 'true'

      - uses: docker/setup-buildx-action@v4
        if: steps.existing.outputs.skip != 'true'

      # amd64 first, loaded into Docker for the smoke test. Publishing runs
      # don't read the GitHub cache: on a fresh runner that makes them full
      # rebuilds, with current apt packages, base image and fnm/uv.
      - name: Build amd64 for the smoke test
        if: steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          tags: claudecodeui:smoke
          build-args: |
            CLOUDCLI_VERSION=${{ steps.versions.outputs.cloudcli }}
            CLAUDE_CODE_VERSION=${{ steps.versions.outputs.claude }}
            FNM_VERSION=${{ steps.versions.outputs.fnm }}
            UV_VERSION=${{ steps.versions.outputs.uv }}
          cache-from: ${{ env.PUSH != 'true' && 'type=gha' || '' }}

      - name: Smoke test
        if: steps.existing.outputs.skip != 'true'
        env:
          CLOUDCLI: ${{ steps.versions.outputs.cloudcli }}
          CLAUDE: ${{ steps.versions.outputs.claude }}
          FNM: ${{ steps.versions.outputs.fnm }}
          UV: ${{ steps.versions.outputs.uv }}
        run: |
          set -euo pipefail
          # A non-default PUID exercises the entrypoint's user remapping, and
          # the runner's Docker socket (its gid has no group in the image) the
          # socket group setup.
          docker run -d --name smoke -e PUID=1234 -e PGID=1234 \
            -v /var/run/docker.sock:/var/run/docker.sock claudecodeui:smoke
          trap 'docker logs smoke; docker rm -f smoke >/dev/null' EXIT
          for _ in $(seq 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' smoke)"
            [ "$status" = starting ] || break
            # Stop waiting if the server crashed.
            [ "$(docker inspect -f '{{.State.Running}}' smoke)" = true ] || { status=exited; break; }
            sleep 2
          done
          echo "health: $status"
          [ "$status" = healthy ]
          # The image must contain exactly the versions resolved above.
          docker exec -u dev -e CLOUDCLI -e CLAUDE -e FNM -e UV smoke bash -lc '
            set -ex
            [ "$(id -u):$(id -g)" = 1234:1234 ]
            [ "$(stat -c %u /home/dev)" = 1234 ]
            test -r /etc/claude-code/CLAUDE.md
            node --version
            # The image Node.js was seeded as the fnm default, with its npmrc.
            [ -L ~/.local/share/fnm/aliases/default ]
            [[ "$(command -v node)" == "$HOME/.local/share/fnm/aliases/default/bin/node" ]]
            [ "$(npm prefix -g)" = /home/dev/.npm-global ]
            [ "$(cloudcli version 2>/dev/null | tail -1)" = "$CLOUDCLI" ]
            [ "$(claude --version)" = "$CLAUDE (Claude Code)" ]
            [ "$(fnm --version)" = "fnm $FNM" ]
            [[ "$(uv --version)" == "uv $UV "* ]]
            gh --version | head -1
            docker compose version
            docker buildx version
            # dev reaches the mounted socket without sudo.
            docker info --format "{{.ServerVersion}}"
            # The debugging tools work as dev, not only as root.
            ping -c 1 -W 2 127.0.0.1
            strace -f -o /dev/null true
            ss -tln | grep -q ":${SERVER_PORT:-3001} "
            nc -z 127.0.0.1 "${SERVER_PORT:-3001}"
            lsof -p $$ >/dev/null
            dig -v
            pkg-config --version
            rsync --version | head -1
            # Without DIND, no daemon runs here.
            ! pgrep -x dockerd
          '

      - name: Smoke test Docker in Docker
        if: steps.existing.outputs.skip != 'true'
        run: |
          set -euo pipefail
          docker run -d --name smoke-dind --privileged --stop-timeout 30 -e DIND=1 \
            -v smoke-dind:/var/lib/docker claudecodeui:smoke
          trap 'docker logs smoke-dind; docker rm -f smoke-dind >/dev/null; docker volume rm smoke-dind >/dev/null' EXIT
          for _ in $(seq 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' smoke-dind)"
            [ "$status" = starting ] || break
            [ "$(docker inspect -f '{{.State.Running}}' smoke-dind)" = true ] || { status=exited; break; }
            sleep 2
          done
          echo "health: $status"
          [ "$status" = healthy ]
          docker exec -u dev smoke-dind bash -lc '
            set -ex
            # The daemon is this container, reachable by dev without sudo.
            [ "$(docker info --format "{{.Name}}")" = "$(hostname)" ]
            # Bind mounts and ports resolve here, not on the runner.
            mkdir -p /workspaces/smoke && cd /workspaces/smoke
            echo bind-ok > f.txt
            [ "$(docker run --rm -v "$PWD:/w" alpine:3.22 cat /w/f.txt)" = bind-ok ]
            printf "FROM alpine:3.22\nCMD [\"echo\", \"build-ok\"]\n" > Dockerfile
            docker build -q -t smoke-build .
            [ "$(docker run --rm smoke-build)" = build-ok ]
            docker run -d --name web -p 8080:80 -v "$PWD:/usr/share/nginx/html:ro" nginx:alpine
            for _ in $(seq 20); do curl -fsS http://127.0.0.1:8080/f.txt && break; sleep 0.5; done
            [ "$(curl -fsS http://127.0.0.1:8080/f.txt)" = bind-ok ]
            docker compose version
            # Ignores SIGTERM, so the inner Docker waits out its 10s for it.
            docker run -d --name keeper --restart unless-stopped alpine:3.22 sleep 1d
          '
          # dockerd shuts down cleanly within the stop timeout, not killed.
          docker stop smoke-dind
          [ "$(docker inspect -f '{{.State.ExitCode}}' smoke-dind)" = 0 ]
          log="$(docker cp smoke-dind:/var/log/dockerd.log - | tar -xO)"
          grep -q "Daemon shutdown complete" <<<"$log" || { tail -20 <<<"$log"; exit 1; }
          # A restart starts dockerd again despite the last run's runtime
          # state, and brings back containers with a restart policy.
          docker start smoke-dind
          for _ in $(seq 30); do
            docker exec -u dev smoke-dind docker ps --format '{{.Names}}' 2>/dev/null | grep -qx keeper && break
            sleep 2
          done
          docker exec -u dev smoke-dind docker ps --format '{{.Names}}' | grep -qx keeper

      # Reuses the tested amd64 layers from the builder and adds arm64: from
      # the GitHub cache on PRs, from scratch when publishing.
      - name: Build multi-arch and push
        id: build
        if: steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          build-args: |
            CLOUDCLI_VERSION=${{ steps.versions.outputs.cloudcli }}
            CLAUDE_CODE_VERSION=${{ steps.versions.outputs.claude }}
            FNM_VERSION=${{ steps.versions.outputs.fnm }}
            UV_VERSION=${{ steps.versions.outputs.uv }}
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.title=claudecodeui
            org.opencontainers.image.description=CloudCLI UI (siteboon/claudecodeui) bundled with Claude Code
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}
            io.github.cheziyi.claudecodeui-docker.cloudcli-version=${{ steps.versions.outputs.cloudcli }}
            io.github.cheziyi.claudecodeui-docker.claude-code-version=${{ steps.versions.outputs.claude }}
            io.github.cheziyi.claudecodeui-docker.fnm-version=${{ steps.versions.outputs.fnm }}
            io.github.cheziyi.claudecodeui-docker.uv-version=${{ steps.versions.outputs.uv }}
          cache-from: ${{ env.PUSH != 'true' && 'type=gha' || '' }}
          cache-to: type=gha,mode=max

      # Each of X.Y, X and latest moves only if this is the highest release in
      # that line, so a patch to an older line can't take latest backwards.
      # Checked against the release tags as they are now, after the push, so a
      # slower run of an older release can't move them back either.
      - name: Move X.Y, X and latest
        if: env.PUSH == 'true' && steps.existing.outputs.skip != 'true'
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
          REVISION: ${{ steps.release.outputs.revision }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Pre-releases get only their exact tag.
          [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]] || exit 0
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"
          git fetch -q --force --tags origin
          # A patch release's tag is created in the next step; count it here.
          git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null || git tag "v$VERSION" "$REVISION"
          stable() { git tag --list 'v*' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V; }

          tags=()
          [ "$(stable | grep "^v$major\.$minor\." | tail -1)" = "v$VERSION" ] && tags+=("$major.$minor")
          [ "$(stable | grep "^v$major\." | tail -1)" = "v$VERSION" ] && tags+=("$major")
          [ "$(stable | tail -1)" = "v$VERSION" ] && tags+=(latest)
          if [ ${#tags[@]} -eq 0 ]; then
            echo "A newer release has $major.$minor; no tags moved." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker buildx imagetools create "${tags[@]/#/--tag=$IMAGE:}" "$IMAGE@$DIGEST"
          echo "Moved ${tags[*]} to $VERSION" >> "$GITHUB_STEP_SUMMARY"

      # Last, so a run that fails earlier leaves no tag and the next one retries
      # the same version. The tag is on the patched release's commit: only the
      # upstream versions differ. An App's tag starts another run, which skips
      # because this version's image exists.
      - name: Create the GitHub release
        if: env.PUSH == 'true' && github.event_name != 'push' && steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          REVISION: ${{ steps.release.outputs.revision }}
          CHANGES: ${{ steps.existing.outputs.changes }}
        run: |
          set -euo pipefail
          notes="Rebuilt with current Debian packages."
          [ -z "$CHANGES" ] || notes="Updates $CHANGES, with current Debian packages."
          highest="$(git tag --list 'v*' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)"
          latest=false
          [ "$highest" != "v$VERSION" ] || latest=true
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$REVISION" \
            --title "v$VERSION" --notes "$notes" --latest="$latest"

      # Runs on skipped days too, so a failed update is retried by the next run.
      - name: Record the release on main
        if: env.PUSH == 'true' && !(github.event_name == 'push' && steps.existing.outputs.skip == 'true')
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.existing.outputs.skip == 'true' && steps.release.outputs.base || steps.release.outputs.version }}
          CHANGES: ${{ steps.existing.outputs.changes }}
          CLOUDCLI: ${{ steps.versions.outputs.cloudcli }}
          CLAUDE: ${{ steps.versions.outputs.claude }}
          FNM: ${{ steps.versions.outputs.fnm }}
          UV: ${{ steps.versions.outputs.uv }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::No release app configured; not recording $VERSION on main."
            exit 0
          fi
          # Only the highest stable release: versions.env describes what latest has.
          git fetch -q --force --tags origin
          highest="$(git tag --list 'v*' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)"
          [ "$highest" = "v$VERSION" ] || exit 0

          want="# Written by CI: what the newest release contains. To change which
          # versions releases accept, edit upstream.env.
          RELEASE=$VERSION
          CLOUDCLI=$CLOUDCLI
          CLAUDE_CODE=$CLAUDE
          FNM=$FNM
          UV=$UV"
          url="repos/$GITHUB_REPOSITORY/contents/versions.env"
          current="$(gh api "$url?ref=main" 2>/dev/null || true)"
          have="$(jq -r '.content // ""' <<<"${current:-{\}}" | base64 -d)"
          [ "$have" != "$want" ] || exit 0
          args=(-f "message=Release $VERSION${CHANGES:+: $CHANGES}" -f branch=main -f "content=$(base64 -w0 <<<"$want")")
          sha="$(jq -r '.sha // ""' <<<"${current:-{\}}")"
          [ -z "$sha" ] || args+=(-f "sha=$sha")
          gh api -X PUT "$url" "${args[@]}" --silent
          echo "Recorded $VERSION in versions.env on main" >> "$GITHUB_STEP_SUMMARY"
