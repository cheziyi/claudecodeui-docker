name: Build image

on:
  # Every PR builds and smoke-tests the image, with no path filter, so `build`
  # can be a required check. Nothing is pushed.
  pull_request:
  # Pushing a release tag (v1.2.3, or v1.2.3-rc.1 for a pre-release) publishes
  # that release.
  push:
    tags: ["v*"]
  # Weekly: rebuild the latest release when CloudCLI or Claude Code has a new
  # version, picking up Debian and fnm/uv updates along the way.
  schedule:
    - cron: "17 4 * * 1"
  # Manual: rebuild a release (default: the latest) from scratch, e.g. to pick
  # up security fixes. Publishes only when run from main.
  workflow_dispatch:
    inputs:
      version:
        description: Release to rebuild, e.g. 1.2.3 (default the latest release)
        required: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Also the required status check's name; renaming it breaks branch protection.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PUSH: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Release tags, to find the latest release and which tags move.
          fetch-depth: 0

      # Which release this run builds, checked out, and the tags it gets. Each
      # of X.Y, X and latest moves only if this is the highest release in that
      # line, so a patch to an older line can't take latest backwards.
      - name: Resolve release
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          image="${IMAGE,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          stable() { git tag --list 'v*' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V; }

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              {
                echo "version=0.0.0-pr.${{ github.event.number }}"
                echo "revision=$GITHUB_SHA"
              } >> "$GITHUB_OUTPUT"
              exit 0 ;;
            push)
              tag="$GITHUB_REF_NAME" ;;
            *)
              if [ -n "${INPUT_VERSION:-}" ]; then tag="v${INPUT_VERSION#v}"; else tag="$(stable | tail -1)"; fi
              if [ -z "$tag" ]; then
                echo "skip=true" >> "$GITHUB_OUTPUT"
                echo "No release yet; nothing to rebuild." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                echo "::error::No release tag $tag"
                exit 1
              fi
              git checkout --detach "$tag" ;;
          esac

          version="${tag#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$tag is not a release tag (vX.Y.Z or vX.Y.Z-prerelease)"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"

          tags="$image:$version"
          if [ -z "${BASH_REMATCH[3]}" ]; then
            [ "$(stable | grep "^v$major\.$minor\." | tail -1)" = "$tag" ] && tags="$tags,$image:$major.$minor"
            [ "$(stable | grep "^v$major\." | tail -1)" = "$tag" ] && tags="$tags,$image:$major"
            [ "$(stable | tail -1)" = "$tag" ] && tags="$tags,$image:latest"
          fi
          {
            echo "version=$version"
            echo "tags=$tags"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Release $version → ${tags//,/, }" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve upstream versions
        id: versions
        if: steps.release.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # The ranges come from the release being built (upstream.env), so
          # each release line keeps the upstream majors it was released with.
          if [ -f upstream.env ]; then
            # shellcheck source=/dev/null
            . ./upstream.env
          else
            echo "::warning::This release has no upstream.env; using the latest CloudCLI and Claude Code."
          fi
          # Newest version in the range; npm skips pre-releases.
          newest() {
            { npm view "$1@$2" version --json 2>/dev/null || true; } \
              | jq -r 'if type == "array" then .[] elif type == "string" then . else empty end' | sort -V | tail -1
          }
          # Flags a newer upstream release that the range keeps out.
          check_latest() {
            local latest
            latest="$(npm view "$1" version)"
            if [ "$latest" != "$2" ]; then
              echo "::notice::$1 $latest is out but outside $3; staying on $2. Widen the range in upstream.env to adopt it."
              echo "$1 $latest is available outside \`$3\`." >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          cloudcli="$(newest @cloudcli-ai/cloudcli "${CLOUDCLI_RANGE:-latest}")"
          claude="$(newest @anthropic-ai/claude-code "${CLAUDE_CODE_RANGE:-latest}")"
          [ -n "$cloudcli" ] && [ -n "$claude" ] || { echo "::error::No upstream version matches upstream.env"; exit 1; }
          check_latest @cloudcli-ai/cloudcli "$cloudcli" "${CLOUDCLI_RANGE:-latest}"
          check_latest @anthropic-ai/claude-code "$claude" "${CLAUDE_CODE_RANGE:-latest}"
          {
            echo "cloudcli=$cloudcli"
            echo "claude=$claude"
          } >> "$GITHUB_OUTPUT"
          echo "CloudCLI $cloudcli (${CLOUDCLI_RANGE:-latest}), Claude Code $claude (${CLAUDE_CODE_RANGE:-latest})" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        if: env.PUSH == 'true' && steps.release.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Weekly runs skip when the published build of this release already has
      # these CloudCLI and Claude Code versions, read back from its labels.
      - name: Check whether upstream changed
        id: existing
        if: github.event_name == 'schedule' && steps.release.outputs.skip != 'true'
        env:
          REF: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          WANT: ${{ steps.versions.outputs.cloudcli }} ${{ steps.versions.outputs.claude }}
        run: |
          set -euo pipefail
          if ! config="$(docker buildx imagetools inspect "$REF" --format '{{json .Image}}' 2>/dev/null)"; then
            echo "$REF isn't published yet; building it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A multi-platform image gives one config per platform; their labels match.
          have="$(jq -r '(if has("config") then . else (to_entries | first | .value) end).config.Labels
            | "\(.["io.github.cheziyi.claudecodeui-docker.cloudcli-version"]) \(.["io.github.cheziyi.claudecodeui-docker.claude-code-version"])"' <<<"$config")"
          if [ "$have" = "$WANT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$REF already has CloudCLI and Claude Code $WANT; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: docker/setup-qemu-action@v4
        if: steps.release.outputs.skip != 'true' && steps.existing.outputs.skip != 'true'

      - uses: docker/setup-buildx-action@v4
        if: steps.release.outputs.skip != 'true' && steps.existing.outputs.skip != 'true'

      # amd64 first, loaded into Docker for the smoke test. Publishing runs
      # don't read the GitHub cache: on a fresh runner that makes them full
      # rebuilds, with current apt packages, base image and fnm/uv.
      - name: Build amd64 for the smoke test
        if: steps.release.outputs.skip != 'true' && steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          tags: claudecodeui:smoke
          build-args: |
            CLOUDCLI_VERSION=${{ steps.versions.outputs.cloudcli }}
            CLAUDE_CODE_VERSION=${{ steps.versions.outputs.claude }}
          cache-from: ${{ env.PUSH != 'true' && 'type=gha' || '' }}

      - name: Smoke test
        if: steps.release.outputs.skip != 'true' && steps.existing.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # A non-default PUID exercises the entrypoint's user remapping.
          docker run -d --name smoke -e PUID=1234 -e PGID=1234 claudecodeui:smoke
          trap 'docker logs smoke; docker rm -f smoke >/dev/null' EXIT
          for _ in $(seq 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' smoke)"
            [ "$status" = starting ] || break
            # Stop waiting if the server crashed.
            [ "$(docker inspect -f '{{.State.Running}}' smoke)" = true ] || { status=exited; break; }
            sleep 2
          done
          echo "health: $status"
          [ "$status" = healthy ]
          docker exec -u dev smoke bash -lc '
            set -e
            [ "$(id -u):$(id -g)" = 1234:1234 ]
            [ "$(stat -c %u /home/dev)" = 1234 ]
            node --version
            fnm --version
            uv --version
            claude --version
            gh --version | head -1
          '

      # Reuses the tested amd64 layers from the builder and adds arm64: from
      # the GitHub cache on PRs, from scratch when publishing.
      - name: Build multi-arch and push
        if: steps.release.outputs.skip != 'true' && steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          build-args: |
            CLOUDCLI_VERSION=${{ steps.versions.outputs.cloudcli }}
            CLAUDE_CODE_VERSION=${{ steps.versions.outputs.claude }}
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.title=claudecodeui-docker
            org.opencontainers.image.description=CloudCLI UI (siteboon/claudecodeui) bundled with Claude Code
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}
            io.github.cheziyi.claudecodeui-docker.cloudcli-version=${{ steps.versions.outputs.cloudcli }}
            io.github.cheziyi.claudecodeui-docker.claude-code-version=${{ steps.versions.outputs.claude }}
          cache-from: ${{ env.PUSH != 'true' && 'type=gha' || '' }}
          cache-to: type=gha,mode=max
