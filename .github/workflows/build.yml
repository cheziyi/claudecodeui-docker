name: Build image

on:
  # Every PR builds and smoke-tests the image, with no path filter, so `build`
  # can be a required check. Nothing is pushed.
  pull_request:
  # Pushing a release tag (v1.2.3, or v1.2.3-rc.1 for a pre-release) publishes
  # that release. The `release` job's tags land here too.
  push:
    tags: ["v*"]
  # Daily: release the next patch when CloudCLI, Claude Code, fnm or uv has a
  # new version within its ranges.
  schedule:
    - cron: "17 4 * * *"
  # Both also release a minor or major when a PR merged since the last release
  # has that label.
  # From main: release now even if nothing upstream changed, e.g. to pick up
  # security fixes or ship merged work.
  # From a release tag: build that release again if its image isn't published.
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise at least (runs from main; PR labels can raise it further)
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  # Release tags each get their own group, so one can't cancel another while
  # it waits. Order doesn't matter: X.Y, X and latest move at the end of a run,
  # only if it's still the highest release (see the last step).
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Releases without building: commits the versions to versions.env on main,
  # then tags that commit, and the tag's push builds it. Every release is a
  # commit on main whose versions.env says exactly what its image contains.
  release:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      # Reads the labels of the PRs merged since the last release.
      pull-requests: read
      # Starts the build of a release whose image is missing.
      actions: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/claudecodeui
    steps:
      - uses: actions/checkout@v7
        with:
          # Release tags, to find the latest release.
          fetch-depth: 0
          persist-credentials: false

      # GITHUB_TOKEN can't commit to main past its ruleset, and tags it creates
      # don't start workflows. See "The release app" in the README.
      - name: Check for the release app
        if: vars.RELEASE_APP_CLIENT_ID == ''
        run: |
          echo "::error::No release app is configured: set the RELEASE_APP_CLIENT_ID variable and the RELEASE_APP_PRIVATE_KEY secret. See \"The release app\" in the README."
          exit 1

      - name: Get the release app's token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # The release commit changes only versions.env, so the token needs no
          # workflows permission.
          permission-contents: write

      - name: Resolve upstream versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/resolve-versions.sh

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compares what the latest release contains, from its versions.env or
      # its image's labels, with the resolved versions. Daily runs release only
      # when they differ, or when a PR merged since then is labelled minor or
      # major.
      - name: Release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          JOB_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          CLOUDCLI: ${{ steps.versions.outputs.cloudcli }}
          CLAUDE: ${{ steps.versions.outputs.claude }}
          FNM: ${{ steps.versions.outputs.fnm }}
          UV: ${{ steps.versions.outputs.uv }}
        run: |
          set -euo pipefail
          # A failed API call inside $(...) fails the step instead of passing
          # for an empty answer.
          shopt -s inherit_errexit
          api="repos/$GITHUB_REPOSITORY"
          image="${IMAGE,,}"
          names=(CloudCLI "Claude Code" fnm uv)
          want="$(printf '%s\n' "$CLOUDCLI" "$CLAUDE" "$FNM" "$UV")"

          latest="$(git tag --list 'v*' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)"
          if [ -z "$latest" ]; then
            echo "::error::No release yet. Push the first release tag by hand."
            exit 1
          fi
          current="${latest#v}"

          # versions_of <ref> <version>: the four versions a release contains,
          # one per line: from its versions.env, or for a tag pushed by hand,
          # which versions.env doesn't name, from the labels of its image.
          # Nothing if that image isn't published.
          versions_of() {
            local env config key
            if env="$(git show "$1:versions.env" 2>/dev/null)" && [ "$(sed -n 's/^RELEASE=//p' <<<"$env")" = "$2" ]; then
              for key in CLOUDCLI CLAUDE_CODE FNM UV; do sed -n "s/^$key=//p" <<<"$env"; done
            elif config="$(docker buildx imagetools inspect "$image:$2" --format '{{json .Image}}' 2>/dev/null)"; then
              # A multi-platform image gives one config per platform; their labels match.
              jq -r '(if has("config") then . else first(.[]) end).config.Labels
                | .["io.github.cheziyi.claudecodeui-docker.cloudcli-version"],
                  .["io.github.cheziyi.claudecodeui-docker.claude-code-version"],
                  .["io.github.cheziyi.claudecodeui-docker.fnm-version"],
                  .["io.github.cheziyi.claudecodeui-docker.uv-version"]' <<<"$config"
            fi
          }
          # changes <from> <to>: "CloudCLI 1.2.3 → 1.2.4, ..." between two
          # such lists; empty if they match.
          changes() {
            local from to out="" i
            mapfile -t from <<<"$1"
            mapfile -t to <<<"$2"
            for i in "${!names[@]}"; do
              [ "${from[i]:-}" = "${to[i]}" ] || out+="${out:+, }${names[i]} ${from[i]:-?} → ${to[i]}"
            done
            echo "$out"
          }
          # publish <version> <commit> <changes>: tags the commit, which starts
          # its build; creating the tag fails if it exists, so a tag pushed by
          # hand meanwhile is never moved. The generated notes add the PRs
          # merged since the last release. If the notes fail, the tag still
          # builds the release.
          publish() {
            local notes="With current Debian packages."
            [ -z "$3" ] || notes="Updates $3, with current Debian packages."
            gh api -X POST "$api/git/refs" -f "ref=refs/tags/v$1" -f "sha=$2" --silent
            gh release create "v$1" --repo "$GITHUB_REPOSITORY" --title "v$1" --notes "$notes" --generate-notes
          }
          # rebuild <tag>: builds a release again, unless a build of it is still
          # running. Re-running its last run uses the workflow of that run,
          # which a tag from before the release job needs; a run too old to
          # re-run is replaced by a dispatch.
          rebuild() {
            local runs id
            runs="$(GH_TOKEN="$JOB_TOKEN" gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch "$1" --limit 20 --json databaseId,status)"
            if jq -e 'any(.[]; .status != "completed")' <<<"$runs" >/dev/null; then
              echo "A build of $1 is still running." >> "$GITHUB_STEP_SUMMARY"
              return
            fi
            id="$(jq -r 'first(.[]).databaseId // empty' <<<"$runs")"
            if [ -z "$id" ] || ! GH_TOKEN="$JOB_TOKEN" gh run rerun "$id" --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
              GH_TOKEN="$JOB_TOKEN" gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$1"
            fi
            echo "::warning::$image:${1#v} isn't published; started its build again."
          }

          # A release commit whose tag never came, because that step failed:
          # tag it now, and release past it once its image is out.
          pending="$(sed -n 's/^RELEASE=//p' versions.env)"
          if [ -n "$pending" ] && ! git rev-parse -q --verify "refs/tags/v$pending^{commit}" >/dev/null; then
            commit="$(git log -1 --format=%H -- versions.env)"
            publish "$pending" "$commit" "$(changes "$(versions_of "$latest" "$current")" "$(versions_of "$commit" "$pending")")"
            echo "::warning::Release $pending was committed at $commit but never tagged. Tagged it now; its tag builds it. Run again once it's published to release past it."
            exit 0
          fi

          have="$(versions_of "$latest" "$current")"
          changed=""
          [ -z "$have" ] || changed="$(changes "$have" "$want")"

          # The biggest bump asked for: by this run, or by a `minor` or `major`
          # label on a PR merged since the latest release, i.e. whose merge
          # commit is between the two. From the merge base, in case the tag was
          # pushed from a branch.
          rank() { case "$1" in major) echo 2 ;; minor) echo 1 ;; *) echo 0 ;; esac; }
          bump="${BUMP:-patch}"
          merged="$(git rev-list "$(git merge-base "$latest" HEAD)..HEAD")"
          labels=""
          if [ -n "$merged" ]; then
            labels="$(GH_TOKEN="$JOB_TOKEN" gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base main --limit 500 --json number,labels,mergeCommit \
              | jq -r --arg merged "$merged" '($merged | split("\n")) as $shas
                | .[] | select(.mergeCommit.oid as $sha | $shas | index($sha)) | "\(.number)\t\(.labels[].name)"')"
          fi
          while IFS=$'\t' read -r number label; do
            if [ -n "$label" ] && [ "$(rank "$label")" -gt "$(rank "$bump")" ]; then
              bump="$label"
              echo "Raised to $bump by the label on #$number" >> "$GITHUB_STEP_SUMMARY"
            fi
          done <<<"$labels"

          # Missing while it builds, or because its build failed. Build it
          # again, and release past it when something changed or when asked to
          # by hand, so one failing release doesn't hold up every later one.
          if ! docker buildx imagetools inspect "$image:$current" >/dev/null 2>&1; then
            rebuild "$latest"
            if [ -z "$have" ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
              echo "$latest's versions.env doesn't name it, so what it contains is known only once its image is out; nothing to compare." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          if [ -z "$changed" ] && [ "$bump" = patch ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            echo "$latest already has these versions (${want//$'\n'/, }); nothing to release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          IFS=. read -r major minor patch <<<"$current"
          case "$bump" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            *) version="$major.$minor.$((patch + 1))" ;;
          esac

          # The release commit: its versions.env pins what the tag's build
          # installs. It's made on the commit this run read, and main moves to
          # it only as a fast-forward: if anything landed meanwhile, nothing is
          # committed, rather than releasing it without reading its label.
          content="# Written by CI: what release $version contains, and what its build
          # installs. To change which versions releases accept, edit upstream.env.
          RELEASE=$version
          CLOUDCLI=$CLOUDCLI
          CLAUDE_CODE=$CLAUDE
          FNM=$FNM
          UV=$UV"
          head="$(git rev-parse HEAD)"
          blob="$(gh api -X POST "$api/git/blobs" -f "content=$content" -f encoding=utf-8 --jq .sha)"
          tree="$(jq -n --arg base "$head" --arg blob "$blob" \
            '{base_tree: $base, tree: [{path: "versions.env", mode: "100644", type: "blob", sha: $blob}]}' \
            | gh api -X POST "$api/git/trees" --input - --jq .sha)"
          commit="$(gh api -X POST "$api/git/commits" -f "message=Release $version${changed:+: $changed}" -f "tree=$tree" -f "parents[]=$head" --jq .sha)"
          if ! gh api -X PATCH "$api/git/refs/heads/main" -f "sha=$commit" --silent; then
            echo "::error::main moved past $head while this run read it; nothing was released. Run again."
            exit 1
          fi

          publish "$version" "$commit" "$changed"
          echo "Released v$version at $commit; its tag builds it." >> "$GITHUB_STEP_SUMMARY"

  # Also the required status check's name; renaming it breaks branch protection.
  build:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/claudecodeui
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Release tags, to find which of X.Y, X and latest move.
          fetch-depth: 0
          # The repo is the build context, so keep the token out of it.
          persist-credentials: false

      - name: Resolve release
        id: release
        run: |
          set -euo pipefail
          image="${IMAGE,,}"
          {
            echo "image=$image"
            echo "revision=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "version=0.0.0-pr.${{ github.event.number }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a release tag (vX.Y.Z or vX.Y.Z-prerelease)"
            exit 1
          fi
          {
            echo "version=$version"
            echo "tags=$image:$version"
          } >> "$GITHUB_OUTPUT"
          echo "Release $version" >> "$GITHUB_STEP_SUMMARY"

      # A release commit's versions.env pins its versions; tags pushed by hand
      # and PRs resolve them from upstream.env.
      - name: Resolve upstream versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/resolve-versions.sh "${{ steps.release.outputs.version }}"

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Published versions never change.
      - name: Check whether it's published
        id: existing
        if: env.PUSH == 'true'
        env:
          REF: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$REF is already published; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: docker/setup-qemu-action@v4
        if: steps.existing.outputs.skip != 'true'

      - uses: docker/setup-buildx-action@v4
        if: steps.existing.outputs.skip != 'true'

      # amd64 first, loaded into Docker for the smoke test. Publishing runs
      # don't read the GitHub cache: on a fresh runner that makes them full
      # rebuilds, with current apt packages, base image and fnm/uv.
      - name: Build amd64 for the smoke test
        if: steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          tags: claudecodeui:smoke
          build-args: |
            CLOUDCLI_VERSION=${{ steps.versions.outputs.cloudcli }}
            CLAUDE_CODE_VERSION=${{ steps.versions.outputs.claude }}
            FNM_VERSION=${{ steps.versions.outputs.fnm }}
            UV_VERSION=${{ steps.versions.outputs.uv }}
          cache-from: ${{ env.PUSH != 'true' && 'type=gha' || '' }}

      - name: Smoke test
        if: steps.existing.outputs.skip != 'true'
        env:
          CLOUDCLI: ${{ steps.versions.outputs.cloudcli }}
          CLAUDE: ${{ steps.versions.outputs.claude }}
          FNM: ${{ steps.versions.outputs.fnm }}
          UV: ${{ steps.versions.outputs.uv }}
        run: |
          set -euo pipefail
          # A non-default PUID exercises the entrypoint's user remapping, and
          # the runner's Docker socket (its gid has no group in the image) the
          # socket group setup.
          docker run -d --name smoke -e PUID=1234 -e PGID=1234 \
            -v /var/run/docker.sock:/var/run/docker.sock claudecodeui:smoke
          trap 'docker logs smoke; docker rm -f smoke >/dev/null' EXIT
          for _ in $(seq 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' smoke)"
            [ "$status" = starting ] || break
            # Stop waiting if the server crashed.
            [ "$(docker inspect -f '{{.State.Running}}' smoke)" = true ] || { status=exited; break; }
            sleep 2
          done
          echo "health: $status"
          [ "$status" = healthy ]
          # The image must contain exactly the versions resolved above.
          docker exec -u dev -e CLOUDCLI -e CLAUDE -e FNM -e UV smoke bash -lc '
            set -ex
            [ "$(id -u):$(id -g)" = 1234:1234 ]
            [ "$(stat -c %u /home/dev)" = 1234 ]
            test -r /etc/claude-code/CLAUDE.md
            node --version
            # The image Node.js was seeded as the fnm default, with its npmrc.
            [ -L ~/.local/share/fnm/aliases/default ]
            [[ "$(command -v node)" == "$HOME/.local/share/fnm/aliases/default/bin/node" ]]
            [ "$(npm prefix -g)" = /home/dev/.npm-global ]
            [ "$(cloudcli version 2>/dev/null | tail -1)" = "$CLOUDCLI" ]
            [ "$(claude --version)" = "$CLAUDE (Claude Code)" ]
            [ "$(fnm --version)" = "fnm $FNM" ]
            [[ "$(uv --version)" == "uv $UV "* ]]
            gh --version | head -1
            docker compose version
            docker buildx version
            # dev reaches the mounted socket without sudo.
            docker info --format "{{.ServerVersion}}"
            # The debugging tools work as dev, not only as root.
            ping -c 1 -W 2 127.0.0.1
            strace -f -o /dev/null true
            ss -tln | grep -q ":${SERVER_PORT:-3001} "
            nc -z 127.0.0.1 "${SERVER_PORT:-3001}"
            lsof -p $$ >/dev/null
            dig -v
            pkg-config --version
            rsync --version | head -1
            # Without DIND, no daemon runs here.
            ! pgrep -x dockerd
          '

      - name: Smoke test Docker in Docker
        if: steps.existing.outputs.skip != 'true'
        run: |
          set -euo pipefail
          docker run -d --name smoke-dind --privileged --stop-timeout 30 -e DIND=1 \
            -v smoke-dind:/var/lib/docker claudecodeui:smoke
          trap 'docker logs smoke-dind; docker rm -f smoke-dind >/dev/null; docker volume rm smoke-dind >/dev/null' EXIT
          for _ in $(seq 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' smoke-dind)"
            [ "$status" = starting ] || break
            [ "$(docker inspect -f '{{.State.Running}}' smoke-dind)" = true ] || { status=exited; break; }
            sleep 2
          done
          echo "health: $status"
          [ "$status" = healthy ]
          docker exec -u dev smoke-dind bash -lc '
            set -ex
            # The daemon is this container, reachable by dev without sudo.
            [ "$(docker info --format "{{.Name}}")" = "$(hostname)" ]
            # Bind mounts and ports resolve here, not on the runner.
            mkdir -p /workspaces/smoke && cd /workspaces/smoke
            echo bind-ok > f.txt
            [ "$(docker run --rm -v "$PWD:/w" alpine:3.22 cat /w/f.txt)" = bind-ok ]
            printf "FROM alpine:3.22\nCMD [\"echo\", \"build-ok\"]\n" > Dockerfile
            docker build -q -t smoke-build .
            [ "$(docker run --rm smoke-build)" = build-ok ]
            docker run -d --name web -p 8080:80 -v "$PWD:/usr/share/nginx/html:ro" nginx:alpine
            for _ in $(seq 20); do curl -fsS http://127.0.0.1:8080/f.txt && break; sleep 0.5; done
            [ "$(curl -fsS http://127.0.0.1:8080/f.txt)" = bind-ok ]
            docker compose version
            # Ignores SIGTERM, so the inner Docker waits out its 10s for it.
            docker run -d --name keeper --restart unless-stopped alpine:3.22 sleep 1d
          '
          # dockerd shuts down cleanly within the stop timeout, not killed.
          docker stop smoke-dind
          [ "$(docker inspect -f '{{.State.ExitCode}}' smoke-dind)" = 0 ]
          log="$(docker cp smoke-dind:/var/log/dockerd.log - | tar -xO)"
          grep -q "Daemon shutdown complete" <<<"$log" || { tail -20 <<<"$log"; exit 1; }
          # A restart starts dockerd again despite the last run's runtime
          # state, and brings back containers with a restart policy.
          docker start smoke-dind
          for _ in $(seq 30); do
            docker exec -u dev smoke-dind docker ps --format '{{.Names}}' 2>/dev/null | grep -qx keeper && break
            sleep 2
          done
          docker exec -u dev smoke-dind docker ps --format '{{.Names}}' | grep -qx keeper

      # Reuses the tested amd64 layers from the builder and adds arm64: from
      # the GitHub cache on PRs, from scratch when publishing.
      - name: Build multi-arch and push
        id: build
        if: steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          build-args: |
            CLOUDCLI_VERSION=${{ steps.versions.outputs.cloudcli }}
            CLAUDE_CODE_VERSION=${{ steps.versions.outputs.claude }}
            FNM_VERSION=${{ steps.versions.outputs.fnm }}
            UV_VERSION=${{ steps.versions.outputs.uv }}
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.title=claudecodeui
            org.opencontainers.image.description=CloudCLI UI (siteboon/claudecodeui) bundled with Claude Code
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}
            io.github.cheziyi.claudecodeui-docker.cloudcli-version=${{ steps.versions.outputs.cloudcli }}
            io.github.cheziyi.claudecodeui-docker.claude-code-version=${{ steps.versions.outputs.claude }}
            io.github.cheziyi.claudecodeui-docker.fnm-version=${{ steps.versions.outputs.fnm }}
            io.github.cheziyi.claudecodeui-docker.uv-version=${{ steps.versions.outputs.uv }}
          cache-from: ${{ env.PUSH != 'true' && 'type=gha' || '' }}
          cache-to: type=gha,mode=max

      # Each of X.Y, X and latest moves only if this is the highest release in
      # that line, so a release of an older line can't take latest backwards.
      # Checked against the release tags as they are now, after the push, so a
      # slower run of an older release can't move them back either.
      - name: Move X.Y, X and latest
        if: env.PUSH == 'true' && steps.existing.outputs.skip != 'true'
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Pre-releases get only their exact tag.
          [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]] || exit 0
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"
          git fetch -q --force --tags origin
          stable() { git tag --list 'v*' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V; }

          tags=()
          [ "$(stable | grep "^v$major\.$minor\." | tail -1)" = "v$VERSION" ] && tags+=("$major.$minor")
          [ "$(stable | grep "^v$major\." | tail -1)" = "v$VERSION" ] && tags+=("$major")
          [ "$(stable | tail -1)" = "v$VERSION" ] && tags+=(latest)
          if [ ${#tags[@]} -eq 0 ]; then
            echo "A newer release has $major.$minor; no tags moved." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker buildx imagetools create "${tags[@]/#/--tag=$IMAGE:}" "$IMAGE@$DIGEST"
          echo "Moved ${tags[*]} to $VERSION" >> "$GITHUB_STEP_SUMMARY"
